name: build

on:
  push:
  pull_request:

jobs:
  # Runs first and gates the firmware job. The analyser and controller are free of
  # ESP-IDF dependencies, so the whole decision path is testable on a plain host in
  # seconds. Before this job existed, a regression in the environment decision reached
  # firmware unchecked.
  #
  # 2026-10-15：这个 job 以前只跑 C++ 单测，而**上位机那一整层（解析器、状态归约、模拟源、
  # 面板脚本）从来没进过 CI** —— 它恰恰是改动最多的地方。下面两步把它补上：自测是纯标准库
  # Python，渲染校验用 DOM 桩 + 模拟源快照，都不需要设备、串口或显示器。
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S test -B build-host-tests
      - name: Build
        run: cmake --build build-host-tests --parallel
      - name: Run tests
        working-directory: build-host-tests
        run: ctest --output-on-failure
      - name: Host panel self-test
        run: python3 tools/host/tests/test_host.py
      # 启动器默认参数出过真事故（2026-10-23：不带参数重启 host，systemeq 静默消失）。
      # 这条测试锁住两件事：任何默认启动都必须带低延迟 EQ 三件套；默认不得开高延迟六分轨。
      - name: Launcher self-test
        run: sh tools/host/tests/test_launcher.sh
      # 对话感知的**检查器**自己也要被测：它要在真机上分辨"证据没来 / 证据来了没下压 /
      # 不该下压时下压了"。这八个场景是合成数据，不需要设备。
      - name: Conversation-awareness checker self-test
        run: python3 tools/verify_conversation_awareness.py --selftest
      - name: Render check against a mock snapshot
        run: |
          python3 - <<'PY' > /tmp/snapshot.json
          import json, sys
          sys.path.insert(0, 'tools')
          from host.simulating import MockDevice
          from host.state import HostState

          device, state = MockDevice(), HostState(source='mock')
          for step in range(1, 60):
              for line in device.advance(step * 0.1):
                  state.feed_line(line)
          # 当前媒体卡（2026-10-30）：带一份固定内容，让渲染校验真的走到这条分支。
          state.set_media({
              "source": "qqmusic",
              "source_text": "QQ 音乐（tap 执行端） · 正在出声",
              "track": None,
              "track_note": "曲目信息不可读（QQ 音乐未暴露曲目接口）",
              "content_kind": "pop_vocal",
              "content_text": "人声流行（估计）",
              "content_confidence": 0.6,
              "content_basis": "低/中/高能量 10%/80%/10% · 高频密度 20% · 瞬态 10%",
              "tuning": [
                  "环境噪声在 中频 1–2.2 kHz 压过歌曲 → 抬 5/24 段，目标峰值 2.0 dB（剂量 1.4×）。",
                  "遮蔽强度 90%；内容瞬态 20% → 正增益被收缩。",
                  "输出余量 -2.8 dB（防止抬完削波）；累计削波 0 帧。",
              ],
          })
          print(json.dumps(state.snapshot(), ensure_ascii=False))
          PY
          node tools/host/tests/render_check.js /tmp/snapshot.json

  firmware:
    needs: host-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32s3
          path: .
      - uses: actions/upload-artifact@v4
        with:
          name: cores3-noise-adapt-firmware
          if-no-files-found: error
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
            build/flash_args
